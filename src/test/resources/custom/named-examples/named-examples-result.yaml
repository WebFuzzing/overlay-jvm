openapi: 3.1.0
info:
  title: Simple API
  version: 1.0.0
servers:
  - url: https://api.example.com/v1
paths:
  /api:
    post:
      parameters:
        - name: x
          in: query
          schema:
            type: string
          examples:
            bar:
              value: Bar
        - name: y
          in: query
          schema:
            type: string
          examples:
            bar:
              value: Bar
            foo:
              value: Foo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
            examples:
              bar:
                value:
                  id: "bar-id-123"
                  name: "Bar Name Example"
      responses:
        '200':
          description: Successful response
